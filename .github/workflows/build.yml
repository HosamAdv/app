name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          export PATH=$PWD/gradle-8.0/bin:$PATH
          echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "BudgetLock $TAG" \
            --notes "نسخة جديدة من تطبيق BudgetLock"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
